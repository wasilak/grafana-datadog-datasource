# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Builds frontend + backend for all platforms (mage buildAll), packages the zip,
      # fails if package.json version doesn't match the tag, and creates a draft release.
      - id: build
        uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.1
        with:
          go-version: '1.27'
          node-version: '24'
        # Uncomment to enable plugin signing
        # (For more info on how to generate the access policy token see https://grafana.com/developers/plugin-tools/publish-a-plugin/sign-a-plugin#generate-an-access-policy-token)
        # policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}

      - name: Verify archive contains backend binaries
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          unzip -l "$ARCHIVE"
          for target in linux_amd64 linux_arm64 linux_arm darwin_amd64 darwin_arm64 windows_amd64.exe; do
            if ! unzip -l "$ARCHIVE" | grep -q "gpx_wasilak_datadog_datasource_${target}$"; then
              echo "::error::Missing backend binary for ${target} in ${ARCHIVE}"
              exit 1
            fi
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCHIVE_SHA1SUM: ${{ steps.build.outputs.archive-sha1sum }}
        run: |
          gh release upload "$TAG" "$ARCHIVE_SHA1SUM" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
